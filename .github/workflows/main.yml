name: MIPSEL Docker Test with SSH

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: true
        default: 'true'

env:
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        cat /etc/os-release

        
        sudo apt update
        
        sudo mkdir -p /etc/docker
        ​
        sudo echo '{ "experimental": true }' > /etc/docker/daemon.json
        
        sudo systemctl restart docker
        
        sudo docker run --rm --privileged multiarch/qemu-user-static --reset
        
        sudo echo -1 > /proc/sys/fs/binfmt_misc/qemu-mipsn32el
        
        ls -al
        sudo mkdir mipselout

        echo 'sudo 7za a -m0=lzma2 -mx=9 -ms=on mipselout.7z mipselout/' > down.sh
        
        echo 'sudo docker run -it --rm -v /home/runner/work/dockermipsel/dockermipsel/mipselout:/mipselout --privileged multiarch/debian-debootstrap:mipsel-buster /bin/bash' > start.sh
        
        ls -al
    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success'
      with:
        name: Download
        path: mipselout.7z
