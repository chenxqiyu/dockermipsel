name: MIPSEL Docker Test with SSH

on:
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  mipsel-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 设置超时时间

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 设置 QEMU 和 MIPSEL 环境
    - name: Setup MIPSEL environment
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user-static
        docker run --rm --privileged multiarch/qemu-user-static --reset
        docker run --rm --privileged multiarch/qemu-user-static --credential yes --persistent yes -p yes

    # 启动 MIPSEL 容器并暴露 SSH
    - name: Start MIPSEL container with SSH
      run: |
        docker run -d --name mipsel_test \
          -p 2222:22 \
          -e SSH_ENABLE=true \
          -e SSH_PASSWORD=yourpassword \
          -v $(pwd):/workspace \
          multiarch/debian-debootstrap:mipsel-buster \
          /bin/bash -c "apt-get update && \
                        apt-get install -y openssh-server && \
                        mkdir -p /var/run/sshd && \
                        echo 'root:yourpassword' | chpasswd && \
                        /usr/sbin/sshd -D"

    # 使用 SSH 连接到容器
    - name: Connect via SSH
      uses: P3TERX/ssh2actions@v1.0.0

    # 清理容器
    - name: Clean up
      if: always()  # 即使失败也执行清理
      run: |
        docker stop mipsel_test || true
        docker rm mipsel_test || true
